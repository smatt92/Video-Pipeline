name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The enum check talks to a real Postgres rather than a fixture, because the thing
    # being checked is whether the code agrees with the database — a fixture would only
    # prove the code agrees with itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiln
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kiln

    steps:
      # Action majors, not the project's Node. All three run on the node24 runtime; the
      # v4s were on node20, which the runner now force-upgrades while warning that it
      # will stop doing so. `node-version` below is what the project's own scripts run
      # on and is a separate decision.
      #
      # pnpm/action-setup must stay before setup-node: `cache: pnpm` needs pnpm on PATH
      # to locate the store, and it fails confusingly if the order is swapped.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Every guard must gate something ──────────────────────────────────
      # First of all, because it is the check that says whether the rest of this file is
      # the whole story. Twice a guard here has existed and run nowhere; this fails the
      # build when a check-shaped script is reachable from neither `pnpm check` nor this
      # workflow, and equally when an exemption outlives its reason.
      - name: Every guard is wired or explicitly exempt
        run: pnpm check:gates

      # ── The worker image would carry ffmpeg ──────────────────────────────
      # Without the build extension the first ingest dies with `spawn ffmpeg ENOENT`, after
      # the generation has been paid for. A build-time error in place of a runtime one.
      - name: Worker image declares every binary src/ spawns
        run: pnpm check:trigger-build

      # ── Nothing may set a font size --ui-scale cannot move ───────────────
      - name: Font sizes are on the scale
        run: pnpm check:scalable-sizes

      # ── The rule with teeth (CLAUDE.md rule 1) ───────────────────────────
      # First, because it is the cheapest and the one most likely to be violated by a
      # well-meaning shortcut.
      - name: No vendor names outside the driver, publish and storage layers
        run: pnpm check:vendors

      # ── Nothing but the two permitted vars may be client-published ───────
      - name: NEXT_PUBLIC_ prefix guard
        run: pnpm check:public-env

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # ── The one part of stage 6 provable without the vendor ──────────────
      # Character→word conversion and shot-duration derivation. Real assertions that had
      # been run by hand exactly once, because nothing ran them.
      - name: Voice timing unit tests
        run: pnpm test:timings

      # ── Who gets in ──────────────────────────────────────────────────────
      # entryDestination runs in middleware on every request, where a wrong answer is
      # either a redirect loop or an open door. Eight combinations, all enumerated.
      - name: Entry flow truth table
        run: pnpm test:entry

      # ── Migrations must apply to an empty database, in order ─────────────
      # Forward-only means the sequence from nothing is the only sequence that matters.
      # Uses the same script a developer runs, so CI exercises the tool rather than a
      # parallel implementation of it that can drift from it.
      - name: Apply migrations
        run: |
          pnpm db:push "$DATABASE_URL"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      # ── The hand-written enums must match the live CHECK constraints ─────
      - name: Enums match the schema
        run: pnpm check:enums "$DATABASE_URL"

      # ── Generated types must match the migrations ────────────────────────
      # Rebuilds a scratch database from the migration sequence and diffs the regenerated
      # types against the committed ones. Proves migrations ↔ types agreement; proves
      # nothing about the hosted project, which this job never contacts.
      - name: No drift between migrations and committed types
        run: pnpm check:drift "$DATABASE_URL"

      # ── Every catalogue integration must exist after a push, not a reset ──
      # `supabase db push` applies migrations and not seed.sql. Four integrations once
      # lived only in the seed, and the onboarding actions look them up by slug and throw
      # when absent — so three wizard steps could not be walked on a fresh production
      # database. This applies the migrations alone and fails if a catalogue slug has no
      # row. Deliberately after the seed-inclusive apply above: it builds its own scratch
      # database precisely so the seed cannot rescue it.
      - name: Catalogue rows exist without the seed
        run: pnpm check:catalog "$DATABASE_URL"

      # ── ffmpeg, for the two harnesses that produce and read real video ───
      # The ingest and assembly paths have produced three bugs that made a file which
      # plays and is wrong, and duration is the only signal that caught all three. That is
      # not a class of bug to leave to a manual run.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Ingest normalises to the canonical intermediate
        run: pnpm verify:ingest "$DATABASE_URL"

      - name: Rough cut assembles, and a wrong duration is a failed render
        run: pnpm verify:assemble "$DATABASE_URL"

      # ── The review screen's timeline, trims, reorder and gate ────────────
      # A trim shortens the picture and not the voice; the drift lands on every later shot
      # and the file still plays. Same silent-wrongness class as the assembly bugs, one
      # stage earlier, at the point a human is about to say the cut is fine.
      - name: Review timeline, trims, reorder and the publish gate
        run: pnpm verify:review "$DATABASE_URL"

      # ── Attribution, and the aggregate that leaves the building ──────────
      # The roll-up is the one view in the schema written to be pasted into an email, so
      # the anonymisation has to be a property of its columns rather than of whoever
      # pastes it. This asserts the column set directly: a later migration that adds a
      # title or an id to it fails here rather than in somebody's outbox.
      - name: Referral attribution, and the roll-up carries nothing identifying
        run: pnpm verify:referral "$DATABASE_URL"

      # ── The Studio lane, minus the leg that needs a public hostname ──────
      # Creates and drops its own scratch database, so it runs after the checks that read
      # the one above. Section 7 (the billed model call) skips without a key and says so.
      - name: Studio MCP server, tools, auth and spend cap
        run: pnpm verify:studio "$DATABASE_URL"

      - name: Build
        run: pnpm build
        env:
          # Build-time only. The real values live in the deployment environment; these
          # exist so `next build` can complete without secrets, and are never used to
          # reach a real service.
          APP_URL: https://ci.invalid
          WEBHOOK_CALLBACK_BASE_URL: https://ci.invalid
          ALLOWED_EMAIL: ci@ci.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          SUPABASE_SERVICE_ROLE_KEY: ci
          STORAGE_DRIVER: supabase-storage
          SUPABASE_STORAGE_BUCKET: ci
          SUPABASE_S3_ACCESS_KEY_ID: ci
          SUPABASE_S3_SECRET_ACCESS_KEY: ci
          SUPABASE_S3_REGION: us-east-1
          TRIGGER_PROJECT_REF: proj_ci
          TRIGGER_SECRET_KEY: tr_ci
          ANTHROPIC_API_KEY: ci
          VIDEO_DRIVER: none
          USD_INR_RATE: '88.5'
          HIGGSFIELD_API_KEY: ci
          HIGGSFIELD_API_SECRET: ci
          HIGGSFIELD_WEBHOOK_SECRET: ci-placeholder-secret-at-least-32-chars

      # ── The compiled stylesheet, measured in a real browser ──────────────
      # After the build on purpose: it reads .next/static/css, because clamp(), @theme and
      # the utility generation all happen at build time and the source tokens are the
      # input to a compiler rather than the thing that ships.
      #
      # Both browser harnesses find Chromium through scripts/lib/chrome.mjs rather than a
      # constant. The constant was the dev container's Playwright path, pinned to a version
      # — it exists on no runner, and it would have failed here as an ENOENT on a binary
      # rather than as "there is no browser". GitHub's ubuntu image ships Chrome; the
      # container ships Playwright's; the search covers both and refuses if neither.
      - name: Display scaling, WCAG 1.4.4 / 1.4.10 / 1.4.12 / 2.5.8
        run: pnpm verify:scaling

      # ── The tour backdrop, on the real route ─────────────────────────────
      # Starts the production server and drives /onboarding over the DevTools protocol.
      # The assertion that earns its place is the contrast one: it composites the WebGL
      # buffer over the page background under the actual heading and paragraph and computes
      # the WCAG ratio. The first version of the scene passed every other check here while
      # putting a solid amber box behind a paragraph — "pixels differ" is not legibility.
      - name: The tour backdrop renders, and the words stay readable over it
        run: pnpm verify:tour
