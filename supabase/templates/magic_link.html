<!doctype html>
<!--
  Kiln sign-in email, on the paper set (tokens.css --paper / --ink / --ac-on-paper; literal
  values mirror src/styles/brand.ts BRAND_HEX). Email clients read no stylesheet, so every
  colour is inline. Voice: what happened, then what to do (BrandVoice). Hosted projects read
  templates from the dashboard, not this file — paste it into Auth → Email Templates → Magic Link.
-->
<html lang="en">
  <body style="margin:0;padding:0;background:#EFECE7;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EFECE7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#F8F6F2;border:1px solid #DAD7D2;border-radius:14px;">
            <tr>
              <td style="padding:28px 28px 8px;font:600 16px/1.2 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#1D1B19;letter-spacing:-0.01em;">kiln</td>
            </tr>
            <tr>
              <td style="padding:8px 28px 0;font:500 20px/1.3 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#1D1B19;">Sign in to Kiln</td>
            </tr>
            <tr>
              <td style="padding:10px 28px 22px;font:400 14px/1.55 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#56524E;">
                Someone asked to sign in as {{ .Email }}. The link works once and expires in an hour.
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 26px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1F7A6E;color:#F8F6F2;text-decoration:none;font:600 14px/1 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;padding:14px 20px;border-radius:10px;">Sign in</a>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 24px;border-top:1px solid #DAD7D2;font:400 12px/1.5 -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#56524E;">
                Not you? Ignore this email — nothing happens until the link is opened.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
