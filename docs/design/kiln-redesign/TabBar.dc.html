<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln tab bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kiln.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.79 0.12 182)}a:hover{color:oklch(0.86 0.10 182)}
</style>
</helmet>
<nav class="tabbar" aria-label="Primary" style="font-family: var(--sans)">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
    <a class="{{ t.cls }}" href="{{ t.href }}"><svg class="ic" viewBox="0 0 24 24"><path d="{{ t.d }}"></path></svg><span>{{ t.label }}</span><sc-if value="{{ t.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="{{ t.bcls }}">{{ t.badge }}</span></sc-if></a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","approvals","cuts","board","more"],"default":"home"},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const t = (key, label, href, d, badge, red) => ({ label, href, d, cls: 'tab' + (key === a ? ' on' : ''), hasBadge: !!badge, badge: badge || '', bcls: 'bdg' + (red ? ' red' : '') });
    return { tabs: [
      t('home', 'Home', 'Home-m.dc.html', 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'),
      t('approvals', 'Approvals', 'Approvals-m.dc.html', 'M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11', '1'),
      t('cuts', 'Cuts', 'Cuts-m.dc.html', 'M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12'),
      t('board', 'Board', 'Board-m.dc.html', 'M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v13h-4z', '2', true),
      t('more', 'More', 'More-m.dc.html', 'M3.5 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M10.5 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M17.5 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0')
    ]};
  }
}
</script>
</body>
</html>
