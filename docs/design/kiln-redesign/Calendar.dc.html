<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln — Calendar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kiln.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:oklch(0.150 0.006 70)}
a{color:oklch(0.79 0.12 182)}a:hover{color:oklch(0.86 0.10 182)}
.st{margin-left:auto;font:500 10px var(--mono);color:var(--t3);text-transform:uppercase;letter-spacing:.04em}
.st.blk{color:oklch(0.78 0.15 25)}.st.drf{color:var(--t2)}
</style>
</helmet>
<div class="k app">
<div class="rail-w"><dc-import name="Rail" active="calendar" channel="bureau" hint-size="100%,1200px"></dc-import></div>
<main class="main">
<header class="topbar">
  <div class="col" style="gap: 0">
    <div class="crumb"><span class="chm"></span><span>Bureau of Reality</span><span class="t4">/</span><span>Calendar</span></div>
    <div class="row" style="gap: 12px"><h1 class="h1">October 2026</h1><div class="row" style="gap: 4px"><button class="btn sm icon" type="button" aria-label="Previous month"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></button><button class="btn sm icon" type="button" aria-label="Next month"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></button></div></div>
  </div>
  <div class="row" style="gap: 10px"><span class="sm t3">Publishing daily at <span class="mono">18:00 IST</span> · 16 open slots in bank</span><div class="seg"><button class="on" type="button">Month</button><button type="button">Week</button><button type="button">List</button></div></div>
</header>

<div class="row" style="gap: 8px">
  <span class="slot sr-incident" style="flex-direction: row; padding: 3px 8px"><span class="sid"><span class="sdot"></span>Incident Report</span></span>
  <span class="slot sr-desk" style="flex-direction: row; padding: 3px 8px"><span class="sid"><span class="sdot"></span>Desk Tour</span></span>
  <span class="slot sr-pip" style="flex-direction: row; padding: 3px 8px"><span class="sid"><span class="sdot"></span>Pip's First Year</span></span>
  <span class="slot sr-archive" style="flex-direction: row; padding: 3px 8px"><span class="sid"><span class="sdot"></span>The Archive</span></span>
  <span class="slot sr-myth" style="flex-direction: row; padding: 3px 8px"><span class="sid"><span class="sdot"></span>Myth Desk</span></span>
  <span class="slot sr-deep" style="flex-direction: row; padding: 3px 8px"><span class="sid"><span class="sdot"></span>Deep Desk</span></span>
  <span class="slot sr-complaint" style="flex-direction: row; padding: 3px 8px"><span class="sid"><span class="sdot"></span>Complaint Box</span></span>
  <span class="slot sr-long" style="flex-direction: row; padding: 3px 8px"><span class="sid"><span class="sdot"></span>Long-form</span></span>
</div>

<div class="scroll-x"><div class="cal" style="min-width: 880px">
  <span class="dow">Mon</span><span class="dow">Tue</span><span class="dow">Wed</span><span class="dow">Thu</span><span class="dow">Fri</span><span class="dow">Sat</span><span class="dow">Sun</span>
  <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
    <div class="{{ d.cls }}">
      <div class="row sb" style="flex-wrap: nowrap"><span class="dn">{{ d.n }}</span><sc-if value="{{ d.hasTag }}" hint-placeholder-val="{{ false }}"><span class="stag">{{ d.tag }}</span></sc-if></div>
      <sc-for list="{{ d.slots }}" as="s" hint-placeholder-count="1">
        <a class="{{ s.cls }}" href="Board.dc.html"><span class="sid"><span class="chm" style="width: 6px; height: 6px"></span>{{ s.id }}<span class="{{ s.stc }}">{{ s.st }}</span></span><span class="tt">{{ s.t }}</span></a>
      </sc-for>
    </div>
  </sc-for>
</div></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      19: [['S001', 'incident', 'What if the Moon vanished', 'blocked']],
      20: [['S002', 'desk', 'Fireworks: metal salts', 'brief']],
      21: [['S003', 'pip', 'S1E1 Orientation: gravity', 'blocked']],
      22: [['S004', 'archive', 'Dancing Plague of 1518', 'open']],
      23: [['S005', 'myth', "Ravana's ten heads", 'open']],
      24: [['S006', 'deep', 'Why Venus spins backwards', 'open']],
      25: [['S007', 'complaint', 'Batteries die in the cold', 'open'], ['L01', 'long', 'Welcome to the Bureau · pilot', 'planned']],
      26: [['S008', 'incident', 'Humans glow like jellyfish', 'open']],
      27: [['S009', 'desk', 'Why leaves turn orange', 'open']],
      28: [['S010', 'pip', 'S1E2 Deja vu', 'open']],
      29: [['S011', 'archive', 'Mary Celeste', 'open']],
      30: [['S012', 'myth', 'Samhain to Halloween', 'open']],
      31: [['S013', 'deep', 'Vampire squid', 'open']]
    };
    const tags = { 20: 'Dussehra', 30: 'Halloween', 31: 'Halloween' };
    const stc = { blocked: 'st blk', brief: 'st drf', open: 'st', planned: 'st' };
    const days = [];
    for (let i = 0; i < 35; i++) {
      let n, out = false;
      if (i < 3) { n = 28 + i; out = true; } else if (i - 2 > 31) { n = i - 2 - 31; out = true; } else { n = i - 2; }
      const sl = (!out && S[n]) ? S[n].map(s => ({ id: s[0], cls: 'slot sr-' + s[1], t: s[2], st: s[3], stc: stc[s[3]] })) : [];
      const tag = !out ? tags[n] : '';
      days.push({ n, cls: 'day' + (out ? ' out' : '') + (!out && n === 7 ? ' today' : ''), slots: sl, hasTag: !!tag, tag: tag || '' });
    }
    return { days };
  }
}
</script>
</body>
</html>
