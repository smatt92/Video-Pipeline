<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiln rail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kiln.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:oklch(0.79 0.12 182)}a:hover{color:oklch(0.86 0.10 182)}
</style>
</helmet>
<nav class="rail k" aria-label="Kiln" style="background: var(--in); font-family: var(--sans); color: var(--t1); position: relative">
  <div class="row sb" style="padding: 2px 4px 0 6px">
    <div class="row" style="gap: 8px"><svg class="ic" viewBox="0 0 24 24" style="width: 18px; height: 18px; color: var(--ac)"><path d="M4 20h16M6 20V10a6 6 0 0 1 12 0v10M9.5 20v-5a2.5 2.5 0 0 1 5 0v5"></path></svg><span style="font-weight: 600; letter-spacing: -0.02em; font-size: 15px">Kiln</span></div>
    <span class="mono xs t4">v2</span>
  </div>

  <div style="position: relative">
    <button class="chsw" type="button" onClick="{{ toggle }}" aria-haspopup="menu">
      <sc-if value="{{ isAll }}" hint-placeholder-val="{{ false }}"><div class="av all"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></div></sc-if>
      <sc-if value="{{ isBureau }}" hint-placeholder-val="{{ true }}"><div class="av">BR</div></sc-if>
      <div class="col grow" style="gap: 1px"><span class="nm">{{ chName }}</span><span class="hd">{{ chHandle }}</span></div>
      <svg class="ic" viewBox="0 0 24 24" style="color: var(--t3)"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
    </button>
    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <div class="raised" role="menu" style="position: absolute; left: 0; right: 0; top: 56px; z-index: 5; padding: 6px; display: flex; flex-direction: column; gap: 2px">
        <a class="ni" href="AllChannels.dc.html" role="menuitem"><div class="av sm all"><svg class="ic" viewBox="0 0 24 24" style="width: 13px; height: 13px"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></div><span>All channels</span></a>
        <a class="ni" href="Home.dc.html" role="menuitem"><div class="av sm">BR</div><div class="col" style="gap: 0; line-height: 1.2"><span>Bureau of Reality</span><span class="mono xs t3">@BureauofReality</span></div></a>
        <div class="hr" style="margin: 4px 0"></div>
        <a class="ni" href="Integrations.dc.html" role="menuitem"><div class="av sm add">+</div><span>Add channel</span></a>
      </div>
    </sc-if>
  </div>

  <button class="cmdk" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>Search or jump<span class="kbd">⌘K</span></button>

  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <div class="nav">
      <span class="lbl nav-h">{{ g.h }}</span>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
        <a class="{{ it.cls }}" href="{{ it.href }}"><svg class="ic" viewBox="0 0 24 24"><path d="{{ it.d }}"></path></svg><span>{{ it.label }}</span><sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span class="{{ it.bcls }}">{{ it.badge }}</span></sc-if></a>
      </sc-for>
    </div>
  </sc-for>

  <div class="rail-foot">
    <div class="inset" style="padding: 10px 12px; display: flex; align-items: center; gap: 10px">
      <svg class="ic" viewBox="0 0 24 24" style="color: var(--t3)"><path d="M12 3v9M6.4 6.4a8 8 0 1 0 11.2 0"></path></svg>
      <div class="col grow" style="gap: 0"><span class="sm" style="font-weight: 500">Kill switch</span><span class="xs t3">Off · pipeline running</span></div>
      <span class="pill s-live nodot" style="height: 20px">armed</span>
    </div>
    <div class="row" style="gap: 10px; padding: 4px 6px">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: var(--s3); display: grid; place-items: center; font: 600 10px var(--mono); color: var(--t2)">SM</div>
      <div class="col grow" style="gap: 0; line-height: 1.25"><span class="sm">Sahil</span><span class="xs t3">approver</span></div>
      <a class="btn ghost sm icon" href="Integrations.dc.html" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4"></path></svg></a>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","approvals","cuts","ready","board","calendar","generation","metrics","costs","authorship","voices","prompts","music","settings"],"default":"home"},"channel":{"editor":"enum","options":["bureau","all"],"default":"bureau"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: false }; }
  renderVals() {
    const a = this.props.active ?? 'home';
    const ch = this.props.channel ?? 'bureau';
    const I = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      approvals: 'M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11',
      cuts: 'M6 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12',
      ready: 'M22 2 11 13M22 2l-7 20-4-9-9-4z',
      board: 'M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v13h-4z',
      calendar: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      generation: 'M7 7h10v10H7zM10 2v3M14 2v3M10 19v3M14 19v3M2 10h3M2 14h3M19 10h3M19 14h3',
      metrics: 'M5 20V11M11 20V5M17 20v-6M3 20h18',
      costs: 'M6 4h12M6 9h12M6 4c7 0 7 10 0 10l9 7',
      authorship: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
      voices: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3',
      prompts: 'M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6',
      music: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
      settings: 'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4'
    };
    const mk = (key, label, href, badge, red) => ({
      label, href, d: I[key], cls: 'ni' + (key === a ? ' on' : ''),
      hasBadge: !!badge, badge: badge || '', bcls: 'badge' + (red ? ' red' : ' ac')
    });
    const groups = [
      { h: 'Bureau', items: [
        mk('home', 'Home', ch === 'all' ? 'AllChannels.dc.html' : 'Home.dc.html'),
        mk('approvals', 'Approvals', 'Approvals.dc.html', '1'),
        mk('cuts', 'Cuts', 'Cuts.dc.html'),
        mk('ready', 'Ready', 'Ready.dc.html'),
        mk('board', 'Board', 'Board.dc.html', '2', true),
        mk('calendar', 'Calendar', 'Calendar.dc.html'),
        mk('generation', 'Generation', 'Generation.dc.html'),
        mk('metrics', 'Metrics', 'Metrics.dc.html'),
        mk('costs', 'Costs', 'Costs.dc.html'),
        mk('authorship', 'Authorship', 'Authorship.dc.html')
      ]},
      { h: 'Library', items: [
        mk('voices', 'Voices', 'Voices.dc.html'),
        mk('prompts', 'Prompts', 'Voices.dc.html'),
        mk('music', 'Music', 'Voices.dc.html')
      ]},
      { h: 'System', items: [ mk('settings', 'Settings', 'Integrations.dc.html') ] }
    ];
    return {
      groups,
      isAll: ch === 'all', isBureau: ch !== 'all',
      chName: ch === 'all' ? 'All channels' : 'Bureau of Reality',
      chHandle: ch === 'all' ? '1 channel · combined' : '@BureauofReality',
      open: this.state.open,
      toggle: () => this.setState({ open: !this.state.open })
    };
  }
}
</script>
</body>
</html>
